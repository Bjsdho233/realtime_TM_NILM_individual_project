# Project-specific Codex defaults for this trusted repository.
# Stable track rules live in AGENTS.md; live authorisation lives in CURRENT_STATE.md.

# Allow routine authorised local work without removing the workspace boundary.
sandbox_mode = "workspace-write"

# Actions outside the workspace boundary still require Tianhang's approval.
approval_policy = "on-request"
approvals_reviewer = "user"

# Cached search supports read-only research without enabling shell network access.
web_search = "cached"

# AGENTS.md can identify the project root before Git is initialised.
project_root_markers = [".git", "AGENTS.md"]

# Shell network access remains disabled unless an approved task enables it.
[sandbox_workspace_write]
network_access = false
